.reader{width:100%;max-width:460px;padding:22px;border-radius:22px;background:rgba(255,255,255,.03);border:1px solid var(--line)}.reader .line{height:14px;border-radius:999px;background:linear-gradient(90deg,rgba(79,209,255,.25),rgba(167,139,250,.25));margin:10px 0}.reader .line.short{width:55%}.reader .expr{margin-top:18px;padding:18px;border-radius:16px;background:rgba(255,255,255,.04);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--txt);font-size:20px;text-align:center}
.matrix-table{display:grid;grid-template-columns:repeat(4,62px);gap:8px}.cell{width:62px;height:62px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);display:grid;place-items:center;font-weight:800}.cell.hot{background:linear-gradient(135deg,rgba(79,209,255,.22),rgba(167,139,250,.16));border-color:rgba(79,209,255,.34)}
.pipeline{display:grid;gap:10px;width:100%;max-width:420px}.pstep{padding:15px 16px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--line);position:relative}.pstep::after{content:'↓';position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);color:var(--faint)}.pstep:last-child::after{display:none}
.bowl{position:relative;width:100%;max-width:420px;height:280px;border-radius:26px;background:radial-gradient(ellipse at center,rgba(79,209,255,.09),rgba(255,255,255,.02));border:1px solid var(--line);overflow:hidden}.contour{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid rgba(79,209,255,.16);border-radius:50%}.c1{width:300px;height:180px}.c2{width:240px;height:140px}.c3{width:180px;height:100px}.c4{width:120px;height:62px}.ball{position:absolute;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--amber),var(--orange));left:18%;top:20%;box-shadow:0 0 24px rgba(251,191,36,.25);animation:roll 5s ease-in-out infinite}.trail{position:absolute;left:24%;top:25%;width:44%;height:2px;background:linear-gradient(90deg,transparent,var(--amber),transparent);transform:rotate(28deg);opacity:.8}@keyframes roll{0%,100%{left:18%;top:20%}50%{left:46%;top:48%}}
.apps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%}@media(max-width:700px){.apps-grid{grid-template-columns:1fr 1fr}}.app{padding:16px;border-radius:18px;background:rgba(255,255,255,.03);border:1px solid var(--line);min-height:120px}.app i{font-style:normal;font-size:26px;display:block;margin-bottom:8px}.app b{display:block;margin-bottom:5px}.app p{font-size:13px;color:var(--dim)}

<script>
const slides = [
  {eyebrow:'Lecture 0 · Opening', title:'Open the Machine', lead:'Linear Algebra • Calculus • Optimization', body:['A first look at the hidden structure behind intelligence, colour, motion, search, vision, and decision-making.','This is the first lecture of the course. Its job is not to prove everything. Its job is to make you curious enough to want the machinery behind modern systems.'], quote:'After this course, black boxes should look different.', visual:'cover'},
  {eyebrow:'Metaphor', title:'Do not stop at the dial', lead:'Visible behaviour is the dial. Structure is the mechanism.', body:['In many systems, what you see is only the surface. The real power lies in the invisible structure underneath.','This course teaches you to open the casing — to move from behaviour to mechanism, from output to mathematics.'], visual:'dial'},
  {eyebrow:'Linear Algebra in Action', title:'How matrix math powers worlds', lead:'When a game character turns, does the computer redraw the universe by hand?', body:['No. A matrix can act on thousands of points at once.','The same transformation rule moves every point in a consistent way. That is why matrices are so powerful in graphics, vision, and simulation.'], quote:'new position = A(old position)', visual:'vectorworld'},
  {eyebrow:'Linear Algebra in Action', title:'Rank can hear the room', lead:'Independent information reveals hidden structure.', body:['When multiple sound sources are recorded by microphones, linear algebra helps infer source locations and even aspects of the room shape.','Rank measures how much independent information is truly present. It is not just a number from a chapter — it tells us what the system can or cannot reveal.'], quote:'rank = independent information', visual:'ranksound'},
  {eyebrow:'Course Goals', title:'What should you be able to do after M3?', lead:'Not: “I know formulas.”  Yes: “I can use mathematical structure to reason about systems.”', body:['You will model real situations, compute with mathematical tools, interpret results, build small computational experiments, and explain your logic clearly.'], bullets:[['Model','Translate real systems into variables, vectors, matrices, functions, and constraints.'],['Compute','Solve systems, transform vectors, differentiate functions, and optimize objectives.'],['Interpret','Move between algebra, geometry, computation, and meaning.'],['Build','Implement simple mathematical models in Python and verify them experimentally.'],['Explain','Defend the logic behind your solution, not only the final answer.']], visual:'objectives'},
  {eyebrow:'How We Learn', title:'Every important idea appears through five windows', lead:'Lecture sheets are not spectators’ notes. They are workout sheets.', body:['The same concept should be seen in multiple forms so that you can truly own it.'], bullets:[['Write it by hand','Feel the structure actively, not passively.'],['See it geometrically','Connect algebra to shapes, motion, and space.'],['Compute it in Python','Turn mathematics into an executable experiment.'],['Animate it mentally','Develop internal pictures, not just formal manipulations.'],['Verify it experimentally','Test the idea and look for evidence.']], visual:'windows'},
  {eyebrow:'Language', title:'The language will change', lead:'Knowing symbols is not the same as reading mathematics.', body:['When you see something like L = { (x,y) ∈ ℝ² : x + 2y = 3 }, you should learn to read it in several ways at once.','Is it a set? An equation? A line? A solution space? Yes — if you learn to read mathematics as a language, not only as notation.'], visual:'language'},
  {eyebrow:'Classroom Culture', title:'Deep work needs conditions', lead:'Rules are not control. They are conditions for deep work.', bullets:[['Phones away','No games, scrolling, YouTube, or messaging during explanation or work time.'],['Laptop closed','Unless the instructor explicitly asks for it, the laptop is not part of the lecture.'],['Worksheet first','Mathematics enters through the hand before it enters through the screen.'],['On time','Late entry breaks your chain and the class rhythm.'],['Ask and respect','Ask doubts early. Do not make others pay for your distraction.']], visual:'agreement'},
  {eyebrow:'Mindset', title:'This course is a gym, not a theatre', lead:'The instructor can design the workout. The student has to lift the weight.', body:['Missing practice and blaming difficulty is like skipping the gym and blaming the trainer.','The course cannot be consumed. It has to be performed. Hear it, see it, do it, explain it.'], quote:'Do it — and you begin to own it.', visual:'mindset'},

function bulletsHTML(bullets=[]){
  return bullets.length ? `<div class="bullets">${bullets.map((b,i)=>`<div class="bullet"><div class="bnum">${i+1}</div><div><b>${b[0]}</b><div class="body">${b[1]}</div></div></div>`).join('')}</div>` : '';
}

const shell = document.getElementById('slideShell');
const dots = document.getElementById('dots');
const tocList = document.getElementById('tocList');
const total = slides.length;
document.getElementById('countTotal').textContent = total;

slides.forEach((s, i) => {
  const slide = document.createElement('section');
  slide.className = 'slide';
  slide.innerHTML = `
    <div class="panel content">
      <div class="count">SLIDE ${String(i+1).padStart(2,'0')}</div>
      <div class="eyebrow">${s.eyebrow}</div>
      ${i===0 ? `<h1>${s.title}</h1>` : `<h2>${s.title}</h2>`}
      ${s.lead ? `<div class="lead">${s.lead}</div>` : ''}
      <div class="body">${(s.body||[]).map(p=>`<p>${p}</p>`).join('')}</div>
      ${bulletsHTML(s.bullets||[])}
      ${s.quote ? `<div class="quote">${s.quote}</div>` : ''}
    </div>
    <div class="panel visual">${visualHTML(s.visual)}</div>`;
  shell.appendChild(slide);

  const dot = document.createElement('button');
  dot.className = 'dot';
  dot.title = `Slide ${i+1}`;
  dot.addEventListener('click', ()=>go(i));
  dots.appendChild(dot);

  const toc = document.createElement('button');
  toc.innerHTML = `<b>${i+1}. ${s.title}</b><small>${s.eyebrow}</small>`;
  toc.addEventListener('click', ()=>{go(i); toggleToc(false);});
  tocList.appendChild(toc);
});

const slideEls = [...document.querySelectorAll('.slide')];
const dotEls = [...document.querySelectorAll('.dot')];
const tocEls = [...tocList.querySelectorAll('button')];
const progressBar = document.getElementById('progressBar');
const countNow = document.getElementById('countNow');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const tocPanel = document.getElementById('tocPanel');
let current = 0;

function update(){
  slideEls.forEach((el,i)=>{
    el.classList.remove('active','prev');
    if(i===current) el.classList.add('active');
    else if(i<current) el.classList.add('prev');
  });
  dotEls.forEach((d,i)=>d.classList.toggle('active',i===current));
  tocEls.forEach((d,i)=>d.classList.toggle('active',i===current));
  progressBar.style.width = (((current+1)/total)*100)+'%';
  countNow.textContent = current+1;
  prevBtn.disabled = current===0;
  nextBtn.disabled = current===total-1;
  nextBtn.textContent = current===total-1 ? 'End of deck' : 'Next →';
}
function go(i){ current=Math.max(0,Math.min(total-1,i)); update(); }
prevBtn.onclick=()=>go(current-1); nextBtn.onclick=()=>go(current+1);
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight' || e.key==='PageDown' || e.key===' '){ e.preventDefault(); go(current+1); }
  if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); go(current-1); }
  if(e.key.toLowerCase()==='m') toggleToc();
  if(e.key==='Escape') toggleToc(false);
});
function toggleToc(force){
  const open = typeof force === 'boolean' ? force : !tocPanel.classList.contains('open');
  tocPanel.classList.toggle('open', open);
}
document.getElementById('tocToggle').onclick = ()=>toggleToc();
update();
</script>
</body>
</html>
